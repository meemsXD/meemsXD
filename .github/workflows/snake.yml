# Рисует «змейку» по графику контрибьюшенов в фирменных цветах профиля
# и кладёт SVG в ветку output — README берёт картинки оттуда.
name: Contribution snake

on:
  schedule:
    - cron: "0 3 * * *"   # раз в сутки
  workflow_dispatch:       # кнопка Run workflow во вкладке Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#2346D8&color_dots=#ebedf0,#c6d0f5,#8fa2ee,#5a74e3,#2346d8
            dist/snake-dark.svg?palette=github-dark&color_snake=#7C95FF&color_dots=#161b22,#1f2a55,#2f4499,#4d67d6,#7c95ff

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
